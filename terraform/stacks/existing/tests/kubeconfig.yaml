# Fake kubeconfig for the stack tests: endpoints only, no credentials.
apiVersion: v1
kind: Config
clusters:
  - name: orbstack
    cluster:
      server: https://127.0.0.1:26443
  - name: kind-dev
    cluster:
      server: https://127.0.0.1:41234
  - name: docker-desktop
    cluster:
      server: https://kubernetes.docker.internal:6443
  - name: prod-aks
    cluster:
      server: https://prod-aks-dns.hcp.example.com:443
contexts:
  - name: orbstack
    context:
      cluster: orbstack
      user: orbstack
  - name: kind-dev
    context:
      cluster: kind-dev
      user: kind-dev
  - name: docker-desktop
    context:
      cluster: docker-desktop
      user: docker-desktop
  - name: prod-aks
    context:
      cluster: prod-aks
      user: prod-aks
users: []
