# azure: multi-zone node pools, so replicas also spread across zones.
# Load balancing and storage come from the outputs contract, not this overlay:
# the shared Gateway's Service gets the Azure load balancer annotations
# (terraform/stacks/azure/platform.yaml), and AKS's Azure Disk CSI driver
# provides the managed-csi default StorageClass.
# Rendered and schema-checked only; golden-k8 never applies to a cloud.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/zone-spread
