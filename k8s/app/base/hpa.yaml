apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello
  labels:
    app.kubernetes.io/name: hello
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello
  # minReplicas = spec.app.replicas, maxReplicas = 2x (generated overlay).
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
