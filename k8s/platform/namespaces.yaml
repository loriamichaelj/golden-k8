# Namespaces golden-k8 creates and manages.
#   tier platform: shared components installed by golden-k8
#   tier workload: tenant namespaces; get quota, limit defaults,
#                  default-deny network policies and the restricted
#                  Pod Security standard
#   gatewayAccess: may attach HTTPRoutes to the shared Gateway
#   podSecurity:   enforced Pod Security level (optional). Defaults to
#                  restricted for workload, baseline for platform
namespaces:
  - name: envoy-gateway-system
    tier: platform
    gatewayAccess: false
  # node-exporter needs hostNetwork, hostPID and hostPath mounts, which only
  # the privileged level allows.
  - name: monitoring
    tier: platform
    gatewayAccess: true
    podSecurity: privileged
  - name: apps
    tier: workload
    gatewayAccess: true
