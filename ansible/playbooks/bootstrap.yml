# Platform bootstrap: everything above the cluster, provider-agnostic.
# Inputs (written by make config / make infra-up / make image):
#   <golden_build_dir>/config.json    normalized environment config
#   <golden_build_dir>/contract.json  infra outputs contract
#   <golden_build_dir>/image.json     locally built app image (optional)
- name: Bootstrap the golden-k8 platform
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/golden.yml
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ golden_contract.kubeconfig_path }}"
      context: "{{ golden_contract.kube_context }}"
  pre_tasks:
    - name: Load inputs
      ansible.builtin.import_tasks: tasks/load.yml
  roles:
    - role: preflight
    - role: render
    - role: namespaces
    - role: gateway
    - role: observability
    - role: app
      when: golden_config.spec.app.enabled
