# Turn config + contract into plain YAML under build/rendered/. Every later
# role applies these files; nothing is decided at apply time (ADR-009).
- name: Create render directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ render_dir }}/platform"
    - "{{ render_dir }}/values"
    - "{{ render_dir }}/app"

- name: Render platform manifests
  ansible.builtin.template:
    src: "{{ render_platform_dir }}/templates/{{ item }}.j2"
    dest: "{{ render_dir }}/platform/{{ item }}"
    mode: "0644"
  loop:
    - namespaces.yaml
    - gateway.yaml

- name: Render Helm values
  ansible.builtin.template:
    src: "{{ render_platform_dir }}/templates/values/{{ item.values_file }}.j2"
    dest: "{{ render_dir }}/values/{{ item.values_file }}"
    mode: "0644"
  loop: "{{ golden_releases }}"
  loop_control:
    label: "{{ item.name }}"

- name: Render the app overlay
  ansible.builtin.template:
    src: "{{ render_app_dir }}/overlay.yaml.j2"
    dest: "{{ render_dir }}/app/kustomization.yaml"
    mode: "0644"
  when: golden_config.spec.app.enabled

- name: Build the app manifests with Kustomize
  ansible.builtin.command:
    cmd: "{{ golden_kubectl }} kustomize {{ render_dir | quote }}/app"
  register: render_app_build
  changed_when: false
  when: golden_config.spec.app.enabled

- name: Write the app manifests
  ansible.builtin.copy:
    content: "{{ render_app_build.stdout }}\n"
    dest: "{{ render_dir }}/app.yaml"
    mode: "0644"
  when: golden_config.spec.app.enabled
