- name: Install Helm releases for group {{ releases_group }}
  kubernetes.core.helm:
    name: "{{ item.name }}"
    chart_ref: "{{ item.chart }}"
    chart_version: "{{ item.version }}"
    release_namespace: "{{ item.namespace }}"
    # Explicit, not module_defaults: helm must never fall back to ~/.kube/config.
    kubeconfig: "{{ golden_contract.kubeconfig_path }}"
    context: "{{ golden_contract.kube_context }}"
    create_namespace: false
    values_files:
      - "{{ golden_build_dir }}/rendered/values/{{ item.values_file }}"
    wait: true
    wait_timeout: "{{ item.wait_timeout | default('5m') }}"
    atomic: true
  loop: "{{ golden_releases | selectattr('group', 'equalto', releases_group) | list }}"
  loop_control:
    label: "{{ item.name }}@{{ item.version }}"
