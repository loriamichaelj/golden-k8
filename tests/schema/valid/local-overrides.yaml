apiVersion: golden.k8/v1alpha1
kind: Environment
metadata:
  name: demo
  tags:
    team: platform
spec:
  provider: local
  cluster:
    nodePools:
      - name: system
        size: small
        min: 1
        max: 1
      - name: apps
        size: medium
        min: 2
        max: 2
  app:
    replicas: 1
    expose:
      enabled: false
