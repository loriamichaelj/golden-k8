# Single source of truth for tool versions, used locally and in CI.
# Install everything with: make tools

[tools]
# Infrastructure
terraform = "1.17.2"
tflint = "0.66.0"

# Kubernetes
kind = "0.33.0"
kubectl = "1.37.2"
helm = "4.3.2"
kubeconform = "0.8.0"

# Config
yq = "4.54.3"

# Sample app
go = "1.27.4"
golangci-lint = "2.15.0"

# Lint / security
actionlint = "1.7.12"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
trivy = "0.76.1"
checkov = "3.4.3"

# Python-based tools (isolated environments via uv).
# The Ansible runtime (ansible-core + kubernetes client) is locked separately
# in ansible/pyproject.toml + ansible/uv.lock.
python = "3.13.18"
uv = "0.13.9"
"pipx:ansible-lint" = "26.11.0"
"pipx:yamllint" = "1.38.0"
"pipx:check-jsonschema" = "0.39.0"
"pipx:pre-commit" = "4.7.0"

[settings]
lockfile = true
pipx.uvx = true
