extends: default

ignore: |
  build/
  .mise/

rules:
  document-start: disable
  line-length:
    max: 160
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false        # allows GitHub Actions' `on:` key
  comments:
    min-spaces-from-content: 2
  indentation:
    spaces: 2
    indent-sequences: consistent
