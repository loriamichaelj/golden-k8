# yaml-language-server: $schema=../schema/golden.schema.json
# Deploy the platform and sample app onto OrbStack's built-in Kubernetes.
# golden-k8 creates no cluster here, and only touches it when you confirm:
#   make up    ENV=environments/existing-orbstack.yaml CONFIRM_EXISTING=yes
#   make smoke CONFIRM_EXISTING=yes
#   make down  ENV=environments/existing-orbstack.yaml CONFIRM_EXISTING=yes
# Guardrails refuse any context outside allowedContexts or not on this machine.
apiVersion: golden.k8/v1alpha1
kind: Environment
metadata:
  name: orbstack
spec:
  provider: existing
  cluster:
    existing:
      context: orbstack
      # storageClass: omitted to use the cluster's default StorageClass
  pipeline:
    apply: true   # opt in to installing onto this cluster
