version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
