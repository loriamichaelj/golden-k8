name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Lint
        env:
          # tflint --init downloads its rulesets from GitHub releases.
          GITHUB_TOKEN: ${{ github.token }}
        run: make lint

  config:
    name: config contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Config contract tests
        run: make test-config

      - name: Existing-cluster guardrails (fake kubeconfigs, no cluster)
        run: make test-guardrails

  app:
    name: app + manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Go unit tests (race detector)
        run: make test-app

      - name: Kustomize overlays (kubeconform, strict)
        run: make test-manifests

  # The golden path, exactly as other repositories call it: the local
  # environment runs end to end on kind; the cloud examples are rendered and
  # schema-checked with no credentials. One cloud entry takes the remote path
  # (golden-k8 checked out a second time at this commit) to keep that tested.
  golden-path:
    name: golden path (${{ matrix.name }})
    needs: [config, app]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: local-ci
            config-file: environments/local-ci.yaml
            apply: true
            checkout: auto
          - name: aws, remote checkout
            config-file: environments/aws-example.yaml
            apply: false
            checkout: remote
          - name: gcp
            config-file: environments/gcp-example.yaml
            apply: false
            checkout: auto
          - name: azure
            config-file: environments/azure-example.yaml
            apply: false
            checkout: auto
    uses: ./.github/workflows/golden-path.yml
    with:
      config-file: ${{ matrix.config-file }}
      apply: ${{ matrix.apply }}
      checkout: ${{ matrix.checkout }}
      golden-repository: ${{ github.repository }}
      golden-ref: ${{ github.sha }}

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          tools: gitleaks

      - name: Scan git history
        run: make secrets
