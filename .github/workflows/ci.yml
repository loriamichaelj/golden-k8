# golden-k8's own CI.
#
#   lint            pre-commit: formatting, linters, schemas, tflint, ansible-lint
#   config          config contract tests + existing-cluster guardrails
#   terraform       every Terraform module and stack, mocked providers
#   app             Go unit tests + every Kustomize overlay through kubeconform
#   secrets         gitleaks over the full history
#   security        Trivy (gates on HIGH/CRITICAL) + Checkov, SARIF to code scanning
#   golden-path     the reusable workflow, as other repositories call it:
#                   local-ci end to end on kind; aws, gcp, azure rendered only
#
# Nothing here has cloud credentials or creates cloud resources.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Lint
        env:
          # tflint --init downloads its rulesets from GitHub releases.
          GITHUB_TOKEN: ${{ github.token }}
        run: make lint

  config:
    name: config contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Config contract tests
        run: make test-config

      - name: Existing-cluster guardrails (fake kubeconfigs, no cluster)
        run: make test-guardrails

  terraform:
    name: terraform (all stacks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Terraform tests (every module and stack, mocked providers)
        run: make test-terraform

      - name: Job summary
        if: always()
        run: cat build/summary/terraform.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  app:
    name: app + manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Go unit tests (race detector)
        run: make test-app

      - name: Kustomize overlays (kubeconform, strict)
        run: make test-manifests

  # The golden path, exactly as other repositories call it: the local
  # environment runs end to end on kind; the cloud examples are rendered and
  # schema-checked with no credentials. Each entry's terraform job tests only
  # its provider (the terraform job above covers everything once). One cloud
  # entry takes the remote path (golden-k8 checked out a second time at this
  # commit) to keep that tested.
  golden-path:
    name: golden path (${{ matrix.name }})
    needs: [config, app]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: local-ci
            config-file: environments/local-ci.yaml
            apply: true
            checkout: auto
          - name: aws, remote checkout
            config-file: environments/aws-example.yaml
            apply: false
            checkout: remote
          - name: gcp
            config-file: environments/gcp-example.yaml
            apply: false
            checkout: auto
          - name: azure
            config-file: environments/azure-example.yaml
            apply: false
            checkout: auto
    uses: ./.github/workflows/golden-path.yml
    with:
      config-file: ${{ matrix.config-file }}
      apply: ${{ matrix.apply }}
      checkout: ${{ matrix.checkout }}
      golden-repository: ${{ github.repository }}
      golden-ref: ${{ github.sha }}

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          tools: gitleaks

      - name: Scan git history
        run: make secrets

  security:
    name: security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Fetch registry modules (scanned with the modules that wrap them)
        run: |
          for dir in terraform/modules/*/*/; do
            mise exec -- terraform -chdir="$dir" get >/dev/null
          done

      - name: Trivy + Checkov
        run: make security

      - name: Upload Trivy results (Terraform)
        if: always() && hashFiles('build/security/trivy-modules.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: build/security/trivy-modules.sarif
          category: trivy-terraform

      - name: Upload Trivy results (app)
        if: always() && hashFiles('build/security/trivy-app.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: build/security/trivy-app.sarif
          category: trivy-app

      - name: Upload Checkov results (Terraform)
        if: always() && hashFiles('build/security/checkov-modules.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: build/security/checkov-modules.sarif
          category: checkov-terraform

      - name: Upload Checkov results (app)
        if: always() && hashFiles('build/security/checkov-app.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: build/security/checkov-app.sarif
          category: checkov-app

      - name: Job summary
        if: always()
        run: cat build/summary/security.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
