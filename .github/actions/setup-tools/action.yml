name: setup-tools
description: Install the tool versions pinned in mise.toml (cached) and restore pre-commit environments.

inputs:
  tools:
    description: Space-separated subset of mise tools to install. Empty installs everything.
    required: false
    default: ""
  root:
    description: golden-k8 checkout directory, relative to the workspace (the reusable workflow checks it out into .golden-k8 when called from another repo).
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Trust the golden-k8 mise config
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
      run: echo "MISE_TRUSTED_CONFIG_PATHS=$GITHUB_WORKSPACE/$ROOT" >> "$GITHUB_ENV"

    - name: Install pinned tools (mise)
      uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a  # v5.2.10
      with:
        version: 2026.11.10
        install_args: ${{ inputs.tools }}
        working_directory: ${{ inputs.root }}
        cache: true

    - name: Cache pre-commit environments
      if: inputs.tools == ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: >-
          pre-commit-${{ runner.os }}-${{ hashFiles(format('{0}/.pre-commit-config.yaml', inputs.root),
          format('{0}/mise.toml', inputs.root), format('{0}/mise.lock', inputs.root)) }}
