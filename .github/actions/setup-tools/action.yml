name: setup-tools
description: Install the tool versions pinned in mise.toml and restore the pre-commit and kubeconform schema caches.

inputs:
  tools:
    description: Space-separated subset of mise tools to install. Empty installs everything.
    required: false
    default: ""
  root:
    description: golden-k8 checkout directory, relative to the workspace (the reusable workflow checks it out into .golden-k8 when called from another repo).
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Trust the golden-k8 mise config
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
      run: echo "MISE_TRUSTED_CONFIG_PATHS=$GITHUB_WORKSPACE/$ROOT" >> "$GITHUB_ENV"

    - name: Install pinned tools (mise)
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      with:
        version: 2026.11.10
        install_args: ${{ inputs.tools }}
        working_directory: ${{ inputs.root }}
        cache: true

    - name: Cache pre-commit environments
      if: inputs.tools == ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: >-
          pre-commit-${{ runner.os }}-${{ hashFiles(format('{0}/.pre-commit-config.yaml', inputs.root),
          format('{0}/mise.toml', inputs.root), format('{0}/mise.lock', inputs.root)) }}

    # kubeconform schemas are pinned to commits in scripts/kubeconform.sh, so a
    # cached copy never goes stale. Restoring it keeps manifest checks off the
    # network (a failed schema download used to fail the whole job). The key
    # changes when the pins or the manifests change, so new kinds get saved;
    # older entries are restored as a base.
    - name: Cache kubeconform schemas
      if: inputs.tools == ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ inputs.root }}/build/kubeconform-cache
        key: >-
          kubeconform-${{ hashFiles(format('{0}/scripts/kubeconform.sh', inputs.root),
          format('{0}/schema/defaults/_cloud.yaml', inputs.root), format('{0}/k8s/**', inputs.root)) }}
        restore-keys: kubeconform-
